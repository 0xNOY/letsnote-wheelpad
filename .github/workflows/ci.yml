name: CI

on:
  workflow_dispatch:
    inputs:
      run_packages:
        description: Build Debian and RPM packages
        required: false
        default: false
        type: boolean
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets

  release:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release

  msrv:
    name: cargo check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  build-deb:
    name: build .deb
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_packages == true)
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --version 3.7.0 --locked
      - run: cargo deb
      - run: python3 tests/verify_package_artifacts.py --deb target/debian/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: letsnote-wheelpad-deb
          path: target/debian/*.deb
          if-no-files-found: error

  build-rpm:
    name: build .rpm
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_packages == true)
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-generate-rpm --version 0.21.0 --locked
      - run: cargo build --release
      - run: cargo generate-rpm
      - run: python3 tests/verify_package_artifacts.py --rpm target/generate-rpm/*.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: letsnote-wheelpad-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error
